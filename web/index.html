<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mz_navigation</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d1117'/%3E%3Cpath d='M4 8h8M8 4v8' stroke='%23e3b04b' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/navigation.css" />
  </head>
  <body>
    <div id="navRoot" class="nav-root" hidden aria-hidden="true">
      <section class="nav-shell" role="dialog" aria-modal="true" aria-labelledby="navTitle">
        <header class="nav-head">
          <div class="nav-brand">
            <span class="nav-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20Z" />
                <path d="M9 4v13.5M15 6.5V20" />
              </svg>
            </span>
            <div class="nav-brand-copy">
              <strong id="navTitle">Mapa</strong>
              <small id="navModeLabel">Navegacao</small>
            </div>
          </div>

          <label class="nav-search" for="navSearch">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" />
              <path d="m16 16 4 4" />
            </svg>
            <input id="navSearch" type="search" aria-label="Buscar local, servico ou ponto" placeholder="Buscar local, servico ou ponto" autocomplete="off" spellcheck="false" />
            <kbd>/</kbd>
          </label>

          <button id="navClose" class="nav-close" type="button" aria-label="Fechar mapa">
            <span>Esc</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </header>

        <div class="nav-body">
          <aside class="nav-side" aria-label="Camadas e destinos">
            <div class="nav-tabs" role="tablist">
              <button type="button" role="tab" data-tab="layers" class="is-active">Camadas</button>
              <button type="button" role="tab" data-tab="favorites">Favoritos</button>
              <button type="button" role="tab" data-tab="recents">Recentes</button>
            </div>
            <div id="navSideContent" class="nav-side-content"></div>
          </aside>

          <div class="nav-mapwrap">
            <svg
              id="navMap"
              class="nav-map"
              viewBox="0 0 1000 1000"
              role="application"
              aria-label="Mapa de San Andreas"
              preserveAspectRatio="xMidYMid slice"
            >
              <defs>
                <radialGradient id="navGlow" cx="50%" cy="45%" r="62%">
                  <stop offset="0%" stop-color="#1b2432" />
                  <stop offset="100%" stop-color="#0d1118" />
                </radialGradient>
              </defs>
              <rect x="-100" y="-100" width="1200" height="1200" fill="url(#navGlow)" />
              <g id="navBaseMap"></g>
              <g id="navTiles"></g>
              <g id="navRegions"></g>
              <g id="navGrid"></g>
              <g id="navDistricts"></g>
              <g id="navNativeBlips"></g>
              <g id="navExternalMarkers"></g>
              <!-- Reservado para a wave Police. Inerte ate existir canal autorizado. -->
              <g id="navPoliceLayer" display="none"></g>
              <g id="navPois"></g>
              <g id="navRoute"></g>
              <g id="navCandidate"></g>
            </svg>

            <div class="nav-map-tools">
              <button type="button" data-zoom="in" aria-label="Aproximar">+</button>
              <button type="button" data-zoom="out" aria-label="Afastar">-</button>
              <button type="button" data-zoom="reset" aria-label="Visao geral">&#9678;</button>
              <button type="button" data-locate="1" aria-label="Minha posicao">&#8982;</button>
            </div>

            <div class="nav-map-meta">
              <span id="navSourceBadge" class="nav-badge">Atlas Los Santos</span>
              <span id="navCoords" class="nav-coords">0, 0</span>
            </div>

            <div class="nav-legend" id="navLegend" aria-label="Legenda"></div>

            <p id="navMapHint" class="nav-hint">Arraste para mover &middot; clique para marcar &middot; scroll para zoom</p>
          </div>
        </div>

        <footer class="nav-foot">
          <div class="nav-selection">
            <span id="navSelectionKicker" class="nav-selection-kicker">Destino</span>
            <strong id="navSelectionLabel">Nenhum ponto selecionado</strong>
            <small id="navSelectionCoords">Clique no mapa ou escolha um local na lista.</small>
          </div>
          <div class="nav-actions">
            <div id="navEditorActions" class="nav-editor-actions" hidden>
              <button id="navEditorSave" type="button" class="nav-btn nav-btn--primary">Salvar</button>
              <button id="navEditorPublish" type="button" class="nav-btn nav-btn--ghost">Publicar</button>
              <button id="navEditorDelete" type="button" class="nav-btn nav-btn--ghost nav-btn--danger">Excluir</button>
              <button id="navEditorClose" type="button" class="nav-btn nav-btn--ghost">Fechar</button>
            </div>
            <button id="navFavorite" type="button" class="nav-btn nav-btn--ghost" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <path d="m12 4 2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 9.7l5.4-.8Z" />
              </svg>
              Favoritar
            </button>
            <button id="navWaypoint" type="button" class="nav-btn nav-btn--ghost" disabled>Waypoint</button>
            <button id="navConfirm" type="button" class="nav-btn nav-btn--primary" hidden>Confirmar destino</button>
          </div>
        </footer>
      </section>

      <div id="navToast" class="nav-toast" role="status" aria-live="polite"></div>
    </div>

    <script src="js/projection.js"></script>
    <script src="js/blips.js"></script>
    <script src="js/strings.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
